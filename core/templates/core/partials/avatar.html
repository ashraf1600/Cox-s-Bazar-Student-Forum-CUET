{% if photo_url %}<img src="{{ photo_url }}" alt="{{ name }}" class="avatar{% if ring %} avatar-ring{% endif %}{% if css %} {{ css }}{% endif %}" style="--avatar-size: {{ size }}px;" loading="lazy">{% else %}<span class="avatar avatar-initials avatar-hue-{{ hue }}{% if ring %} avatar-ring{% endif %}{% if css %} {{ css }}{% endif %}" style="--avatar-size: {{ size }}px;" role="img" aria-label="{{ name }}">{{ initials }}</span>{% endif %}
