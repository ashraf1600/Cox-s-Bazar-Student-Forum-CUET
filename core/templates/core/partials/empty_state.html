<div class="empty-state">
    <div class="empty-state-icon"><i class="fas {{ icon|default:'fa-inbox' }}"></i></div>
    <h5>{{ title }}</h5>
    {% if text %}<p>{{ text }}</p>{% endif %}
    {% if action_url %}<a href="{{ action_url }}" class="btn btn-outline-primary btn-sm">{{ action_label }}</a>{% endif %}
</div>
